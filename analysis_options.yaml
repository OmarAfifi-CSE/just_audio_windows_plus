include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - coverage/**
    # Native C++ and WinRT headers are not Dart sources; the Dart analyzer has
    # nothing to say about them. They are gated by tool/test_native.ps1 and by
    # the Windows build in CI instead.
    - windows/**
    - example/build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
