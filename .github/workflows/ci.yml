name: CI Quality Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: 'stable'

jobs:
  validate:
    name: Static Analysis, Tests & Validation
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Analyze package
        run: flutter analyze --fatal-infos

      - name: Run unit test suite
        run: flutter test --coverage

      - name: Validate dry-run publish
        run: dart pub publish --dry-run

      - name: Install example app dependencies
        run: |
          cd example
          flutter pub get

      - name: Analyze example app
        run: |
          cd example
          flutter analyze --fatal-infos

      - name: Run example widget test
        run: |
          cd example
          flutter test

      - name: Build Windows example app (Verifies MSVC compilation & linkage)
        timeout-minutes: 15
        run: |
          cd example
          flutter build windows --debug

      - name: Run native source and dispatcher tests (39 tests)
        timeout-minutes: 8
        run: ./tool/test_native.ps1 -Configuration Debug

      # Ensure Windows Audio service is started if available
      - name: Start Windows Audio Service
        shell: powershell
        run: |
          try {
            Set-Service -Name Audiosrv -StartupType Automatic -ErrorAction SilentlyContinue
            Start-Service Audiosrv -ErrorAction SilentlyContinue
          } catch {
            Write-Host "Audiosrv could not be started in this environment"
          }

      # Exercises the real compiled plugin on real platform channels. The
      # fixtures are generated PCM WAV plus a loopback HTTP server, so this
      # needs no network access and no external media.
      # In headless environments without audio sinks (e.g. cloud VMs), it gracefully reports and skips.
      - name: Run real Windows playback suite (27 scenarios)
        timeout-minutes: 20
        run: ./tool/test_windows.ps1 -Mode debug

      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-test-results
          path: |
            example/build/windows/x64/plugins/just_audio_windows_plus/Testing/

      - name: Upload playback suite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-playback-test-results
          path: |
            example/build/native-tests-debug/
