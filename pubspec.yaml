name: just_audio_windows_plus
description: 'Hardened native Windows audio engine for Flutter: files, assets, streams, and playlists over WinRT MediaPlayer with full just_audio compatibility and a C++20 core.'
version: 0.5.0
repository: https://github.com/OmarAfifi-CSE/just_audio_windows_plus
issue_tracker: https://github.com/OmarAfifi-CSE/just_audio_windows_plus/issues

topics:
  - audio
  - windows
  - just-audio
  - audio-player
  - media-player

screenshots:
  - description: 'just_audio_windows_plus modern audio player UI on Windows desktop'
    path: screenshots/desktop_player_showcase.png

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: just_audio
    platforms:
      windows:
        pluginClass: JustAudioWindowsPlusPlugin
